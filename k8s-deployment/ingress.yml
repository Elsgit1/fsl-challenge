apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rdicidr-ingress
  namespace: rdicidr
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: rdicidr.me
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: rdicidr
              port:
                number: 8080